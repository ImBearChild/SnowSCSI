[package]
name = "snowscsi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SnowSCSI CLI: serve + mkisofs"
keywords = ["scsi", "iscsi", "usb", "cdrom", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "snowscsi"
path = "src/main.rs"
# The bin target's rustdoc output lands in target/doc/<bin-name>/ — i.e.
# target/doc/snowscsi/ — an empty shell (the real API lives in the
# libraries) whose name shadows nothing but confuses everyone browsing
# target/doc/. Skip documenting it entirely.
doc = false

[features]
default = ["full"]
full = ["std", "scsi", "iscsi", "dvdram", "cdrom", "livefs", "usb", "bundle", "cdr-bundle",
        "log", "tokio", "dep:clap", "dep:ctrlc", "dep:env_logger"]
std = ["snowscsi/std", "dep:clap", "dep:ctrlc", "dep:env_logger"]
scsi = ["snowscsi/scsi"]
dvdram = ["snowscsi/dvdram"]
iscsi = ["snowscsi/iscsi"]
cdrom = ["snowscsi/cdrom"]
livefs = ["snowscsi/livefs"]
usb = ["snowscsi/usb"]
bundle = ["snowscsi/bundle"]
# Persistent CD-R bundle backing (`--cdrom bundle=<dir>`): the library's
# sequential write-once medium with its alternating `toc.0`/`toc.1` slots.
cdr-bundle = ["snowscsi/cdr-bundle"]
log = ["snowscsi/log", "dep:log"]
defmt = ["snowscsi/defmt"]
# Tokio binding for the runtime-agnostic async seams (`--wire async`). The
# library only provides the traits; this feature supplies the platform
# adapters and the multi-threaded executor.
tokio = ["dep:tokio", "snowscsi/async-io"]

[dependencies]
snowscsi.workspace = true
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", features = ["termination"], optional = true }
env_logger = { version = "0.11", optional = true }
log = { workspace = true, optional = true }
embedded-io.workspace = true
heapless.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "signal", "time", "macros", "fs"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
usb-gadget = "1.1"
bytes = "1"
