[package]
name = "snowscsi-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SnowSCSI common: storage seams + logging macros"
keywords = ["scsi", "embedded", "no-std", "storage"]
categories = ["embedded", "no-std"]

[package.metadata.docs.rs]
# `log` and `defmt` are mutually exclusive (see `logging.rs`), so no
# `all-features`; `bundle` enables the ini-based flat-bundle backend.
features = ["std", "log", "bundle", "async-io"]

[features]
default = ["std"]
std = ["embedded-io/std"]
log = ["dep:log"]
defmt = ["dep:defmt", "embedded-io/defmt"]
bundle = ["dep:ini_core"]
# Async storage seams (model-agnostic, no runtime).
async-io = []

[dependencies]
embedded-io.workspace = true
heapless.workspace = true
ini_core = { version = "0.2", default-features = false, optional = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
