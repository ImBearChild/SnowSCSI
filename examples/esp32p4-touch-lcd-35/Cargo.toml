[package]
name = "esp32p4-touch-lcd-35"
version = "0.1.0"
edition = "2021"
publish = false
description = "ESP32-P4-WIFI6-Touch-LCD-3.5 firmware: SD card as a UDF-RW USB optical drive over USB 2.0 High-Speed"
license = "MIT OR Apache-2.0"

# Own (empty) workspace table: keeps this crate detached from the repo-root
# workspace, so `cargo build --workspace` at the root never tries to build it
# (it targets riscv32, which the root workspace does not set up). Build it from
# this directory with `cargo build`.
[workspace]

[[bin]]
name = "esp32p4-touch-lcd-35"
path = "src/main.rs"

[dependencies]
# --- Espressif HAL / RTOS / boot glue ---
# `unstable` is required: esp-hal gates `usb`, `sdmmc`, `psram`, `timer` and the
# `USB_HS`/`FROM_CPU_INTR0` singletons behind it on the P4.
esp-hal = { version = "~1.2.2", features = ["esp32p4", "unstable", "defmt"] }
esp-rtos = { version = "0.4", features = ["embassy", "esp32p4", "defmt"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32p4", "defmt"] }

# --- Panic / logging front-end (defmt route) ---
esp-backtrace = { version = "0.20", features = ["esp32p4", "panic-handler", "defmt"] }
esp-println = { version = "0.18", features = ["esp32p4", "defmt-espflash"] }
defmt = "1.1"

# --- Embassy executor / time / USB class framework ---
embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-usb = { version = "0.6", default-features = false }
embassy-usb-driver = "0.2"

# --- SD card protocol stack over esp-hal sdmmc ---
sdio = "0.5"
block-device-driver = "0.2"
aligned = "0.4"

# --- Status LCD (ST7796, 3.5" 320x480) ---
mipidsi = { version = "0.10", default-features = false }
embedded-graphics = "0.8"

# --- misc ---
static_cell = "2"
embassy-futures = "0.1"      # block_on: drive async SDIO calls from sync seams
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.7"          # StorageError::Io(ErrorKind) for the SD seam
embedded-hal-bus = "0.3"     # ExclusiveDevice: adapt SpiBus -> SpiDevice for mipidsi
heapless = "0.9"             # stack string formatting for the LCD

# --- SnowSCSI workspace seams (no_std) ---
# `async-io` enables the asynchronous storage seams and the `serve_async` shell;
# `embassy` adds the `embassy-usb` endpoint/gadget adapters.
snowscsi = { path = "../../snowscsi", default-features = false, features = ["scsi", "cdrom", "dvdram", "usb", "defmt", "async-io", "embassy"] }
snowscsi-common = { path = "../../snowscsi-common", default-features = false, features = ["defmt", "async-io"] }

# --- Local driver patch (measurement) ---
# Vendor embassy-usb-synopsys-otg 0.4.0 with multi-packet bulk IN transfers
# (`Config::bulk_in_transfer_bytes`); public API kept compatible with 0.4.0 so
# esp-hal 1.2.2 builds unchanged.
[patch.crates-io]
embassy-usb-synopsys-otg = { path = "vendor/embassy-usb-synopsys-otg-0.4.0" }
esp-hal = { path = "vendor/esp-hal-1.2.2" }
sdio = { path = "vendor/sdio-0.5.2" }
