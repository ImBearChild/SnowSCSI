[package]
name = "esp32s3-pocket-dongle"
version = "0.1.0"
edition = "2021"
publish = false
description = "ESP32-S3 Pocket-Dongle firmware: SD card as a UDF-RW USB optical drive"
license = "MIT OR Apache-2.0"

# Own (empty) workspace table: keeps this crate detached from the repo-root
# workspace, so `cargo build --workspace` at the root never tries to build it
# (it targets xtensa and needs the `esp` toolchain). Build it from this
# directory with `cargo +esp build`.
[workspace]

[[bin]]
name = "esp32s3-pocket-dongle"
path = "src/main.rs"

[dependencies]
# --- Espressif HAL / RTOS / boot glue (esp-generate 2026-era template) ---
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable", "defmt"] }
esp-rtos = { version = "0.4", features = ["embassy", "esp32s3", "defmt"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3", "defmt"] }

# --- Panic / logging front-end (defmt route) ---
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "defmt"] }
esp-println = { version = "0.18", features = ["esp32s3", "defmt-espflash"] }
defmt = "1.1"

# --- Embassy executor / time / USB class framework ---
# embassy-executor is a required *direct* dependency: the `#[esp_rtos::main]`
# macro expands to `::embassy_executor::task`, and esp-rtos does not re-export
# the crate. embassy-time is likewise nameable for Timer/Duration.
embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-usb = { version = "0.6", default-features = false }
embassy-usb-driver = "0.2"

# --- SD card protocol stack over esp-hal sdmmc ---
sdio = "0.5"
block-device-driver = "0.2"
aligned = "0.4"

# --- Status LCD (ST7735S) ---
mipidsi = { version = "0.10", default-features = false }
embedded-graphics = "0.8"

# --- misc ---
static_cell = "2"
embassy-futures = "0.1"      # block_on: drive async SDIO calls from sync seams
embedded-hal = "1.0"         # traits (OutputPin/SpiDevice) in scope
embedded-hal-async = "1.0"
embedded-io = "0.7"          # StorageError::Io(ErrorKind) for the SD seam
embedded-hal-bus = "0.3"     # ExclusiveDevice: adapt SpiBus -> SpiDevice for mipidsi
heapless = "0.9"             # stack string formatting for the LCD

# --- SnowSCSI workspace seams (unchanged; no_std) ---
snowscsi = { path = "../../snowscsi", default-features = false, features = ["scsi", "cdrom", "dvdram", "usb", "defmt"] }
snowscsi-common = { path = "../../snowscsi-common", default-features = false, features = ["defmt"] }
