[package]
name = "snowscsi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SnowSCSI SCSI: core + iSCSI + USB MSC + CD-ROM device emulation"
keywords = ["scsi", "iscsi", "usb", "cdrom", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]

[package.metadata.docs.rs]
# `log` and `defmt` are mutually exclusive, so no `all-features`: build every
# transport/media feature with the `log` backend.
features = ["std", "scsi", "iscsi", "usb", "cdrom", "livefs", "dvdram", "bundle", "log", "async-io"]

[features]
default = ["std"]
std = ["embedded-io/std", "snowscsi-common/std", "snowscsi-iso9660/std"]
scsi = []
dvdram = []
iscsi = ["scsi"]
cdrom = ["scsi"]
livefs = ["cdrom"]
usb = ["scsi"]
bundle = ["snowscsi-common/bundle"]
log = ["dep:log", "snowscsi-common/log"]
defmt = ["dep:defmt", "embedded-io/defmt", "snowscsi-common/defmt"]
# Async facade: model-agnostic async seams (no runtime binding).
async-io = ["snowscsi-common/async-io", "usb"]
# embassy-usb adapters for the async facade.
embassy = ["async-io", "usb", "dep:embassy-usb", "dep:embassy-time"]

[dependencies]
embedded-io.workspace = true
heapless.workspace = true
snowscsi-common.workspace = true
snowscsi-iso9660.workspace = true
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embassy-usb = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }

[dev-dependencies]
# `mock-driver` provides the global `embassy-time-driver` symbols (via
# `embassy_time::MockDriver`) for the embassy adapter's unit tests, so this
# crate needs no `unsafe` time shim of its own. `generic-queue-8` selects the
# self-contained timer queue (the default integrated queue needs the executor's
# `__embassy_time_queue_item_from_waker`), and the `std` critical-section impl
# backs the mock driver's internal mutex.
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
critical-section = { version = "1", features = ["std"] }
